<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[EDITOR]]</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="levelEditor.css">
        <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
</head>
<body>
    <div class="moving-platform-div">
        <div class="moving-platform-menu" id="moving-platform-menu">
            <header>
                <h3>Moving Platform edit menu</h3>
                <p>Speed: <input type="number" placeholder=" . . ." id="movingPlatform_inputSpeed"></p>
                <p>Time spent waiting: <input type="number" placeholder=" seconds" id="movingPlatform_inputWait"></p>
                <button class="closeButton" id="closeButton"> <p>x</p> </button>
            </header>
            <table id="moving-platform-table" class="moving-platform-table">
                <!-- autogenerated with script -->
            </table>
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar_top">
            <button id="exportButton"><p>Export all pressed blocks!</p></button>
        </div>
        <div class="sidebar_bottom">
            <h1>Ball starting cords:</h1>
            <button id="copyButtonBall"><p>Copy level info!</p></button>
            <pre id="OutputBall"></pre>
            <h1>Level info output:</h1>
            <button id="copyButton"><p>Copy level info!</p></button>
            <pre id="Output"></pre>
        </div>
    </div>
    <div class="game" id="game">
        <table>
            <!-- autogenerated with script -->
        </table>
    </div>
    <script src="matter.js"></script>
    <script src="levelEditor.js"></script>
</body>
</html>
